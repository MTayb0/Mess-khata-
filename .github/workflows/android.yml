name: Build Android APK
on: {workflow_dispatch: {}, push: {branches: [main]}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Write Supabase config
        run: echo "window.CFG={url:\"${{ secrets.SUPABASE_URL }}\",key:\"${{ secrets.SUPABASE_ANON_KEY }}\"};" > config.js
      - name: Collect web files into www (build-time only)
        run: mkdir www && cp index.html app.js i18n.js styles.css config.js sw.js manifest.webmanifest icon.svg www/
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: tyb-mess-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
